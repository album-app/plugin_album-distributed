# CI Routine for the album framework.

# Prevent duplicate pipelines: only run branch pipelines and cross-project triggers.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

#----------------------------
# templates
#----------------------------

# Windows base template
#
# Downloads conda executable in <current_working_directory>\downloads if executable not present.
# Installs conda in >current_working_directory>\miniconda if conda not already installed.
# Runs conda initialization and configuration.
#
# NOTE: Apparently there is no output for commands split over several lines...
.windows_base_template_micromamba:
  tags:
    - windows
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR\.cache\pip
    ErrorActionPreference: Continue # not working properly
  before_script:
    - 'echo "We are in path: $pwd "'
    - '$7ZIP_EXE=(Join-Path $env:ProgramFiles -ChildPath 7-Zip\7z.exe)'
    - "$7ZIP_INSTALLER=(Join-Path downloads -ChildPath 7z.exe)"
    - "$Env:USERPROFILE=$pwd" # set user profile to current working directory -> will be micromamba default location
    - '$oldProgressPreference = $progressPreference; $progressPreference = "SilentlyContinue";'
    - "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12" # set Security download protocol to avoid https errors
    - "if(-Not (Test-Path $7ZIP_EXE)) {if(-Not (Test-Path $7ZIP_INSTALLER)){Invoke-Webrequest -URI https://www.7-zip.org/a/7z2201-x64.exe -OutFile $7ZIP_INSTALLER}}"
    - 'if(-Not (Test-Path $7ZIP_EXE)) {Start-Process -FilePath $7ZIP_INSTALLER -Args "/S" -Verb RunAs -Wait}'
    - "Invoke-Webrequest -URI https://micro.mamba.pm/api/micromamba/win-64/$env:MICROMAMBA_CI_VERSION -OutFile micromamba.tar.bz2"
    - "& $7ZIP_EXE x micromamba.tar.bz2 -aoa"
    - '& $7ZIP_EXE x micromamba.tar -ttar -aoa -r Library\bin\micromamba.exe $("-o" + (Join-Path -Path (Get-Location) -ChildPath micromamba_installation))'
    - "$progressPreference = $oldProgressPreference"
    - 'Get-ChildItem Env: | Where-Object { $_.Name -match "album" -or $_.Value -match "album" } | Format-Table -AutoSize'
    - '.\micromamba_installation\Library\bin\micromamba.exe create -y -n album -c conda-forge python=$env:TEST_PYTHON_VERSION' # created in .\micromamba\envs\album
    - 'Write-Output "CI_COMMIT_REF_NAME: $env:CI_COMMIT_REF_NAME"'
    - 'Write-Output "ALBUM_DEV_DISTRIBUTED: $env:ALBUM_DEV_DISTRIBUTED"'
    - 'if($env:ALBUM_DEV_DISTRIBUTED -match "True") { echo "CAUTION! DEV ONLY OPTION ACTIVE. ENABLE/DISABLE BY SETTING ALBUM_DEV_DISTRIBUTED GITLAB-RUNNER VARIABLE." }'
    - 'if($env:ALBUM_DEV_DISTRIBUTED -match "True") { .\micromamba_installation\Library\bin\micromamba.exe run -n album pip install git+https://gitlab.com/album-app/album-solution-api.git@dev}'
    - 'if($env:ALBUM_DEV_DISTRIBUTED -match "True") { .\micromamba_installation\Library\bin\micromamba.exe run -n album pip install git+https://gitlab.com/album-app/album-environments.git@dev}'
    - 'if($env:ALBUM_DEV_DISTRIBUTED -match "True") { .\micromamba_installation\Library\bin\micromamba.exe run -n album pip install git+https://gitlab.com/album-app/album.git@dev}'
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album pip install --no-cache-dir -e $Env:CI_PROJECT_DIR' # -e needed for coverage
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album pip install coverage'
    - '$Env:ENVIRONMENT_DEBUGGING_MICROMAMBA_PATH=(Join-Path -Path (Get-Location) -ChildPath micromamba_installation\Library\bin\micromamba.exe)' # set environment variables necessary to work with the environment API
    - "$Env:ENVIRONMENT_CONDA_LOCK_PATH=(Get-Command conda-lock).Source" # explicitly set conda-lock path as it comes as dependency
  cache:
    key: one-key-to-rule-them-all-windows
    paths:
      - .cache\pip

# Linux base template for running tests with micromamba as package manager
#
# Uses a docker image where micromamba will be installed.
# Creates an album environment.
#

.linux_base_template_micromamba:
  image: ubuntu:latest
  tags:
    - docker
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    MICROMAMBA_EXECUTABLE: "" # ensure that the variable is empty before running the job
  before_script:
    - apt update || (sleep 30 && apt update) && apt install -y ca-certificates git curl bzip2
    - mkdir -p $CI_PROJECT_DIR/bin/
    - curl -fsSL --retry 5 --retry-delay 3 https://micro.mamba.pm/api/micromamba/linux-64/$MICROMAMBA_CI_VERSION -o /tmp/micromamba.tar.bz2
    - tar -xvjf /tmp/micromamba.tar.bz2 -C $CI_PROJECT_DIR/bin/ --strip-components=1 bin/micromamba
    - MICROMAMBA_EXECUTABLE=$CI_PROJECT_DIR/bin/micromamba
    - $MICROMAMBA_EXECUTABLE --version
    - $MICROMAMBA_EXECUTABLE create -y -n album -c conda-forge python=$TEST_PYTHON_VERSION
    - echo $CI_COMMIT_REF_NAME
    - echo $ALBUM_DEV_DISTRIBUTED
    - bash -c '[[ $ALBUM_DEV_DISTRIBUTED == "True" ]] && echo "CAUTION! DEV ONLY OPTION ACTIVE. ENABLE/DISABLE BY SETTING ALBUM_DEV_DISTRIBUTED GITLAB-RUNNER VARIABLE." || echo "ALBUM_DEV_DISTRIBUTED not active"'
    - bash -c '[[ $ALBUM_DEV_DISTRIBUTED == "True" ]] && $MICROMAMBA_EXECUTABLE run -n album pip install git+https://gitlab.com/album-app/album-solution-api.git@dev || echo "ALBUM_DEV_DISTRIBUTED not active"'
    - bash -c '[[ $ALBUM_DEV_DISTRIBUTED == "True" ]] && $MICROMAMBA_EXECUTABLE run -n album pip install git+https://gitlab.com/album-app/album-environments.git@dev || echo "ALBUM_DEV_DISTRIBUTED not active"'
    - bash -c '[[ $ALBUM_DEV_DISTRIBUTED == "True" ]] && $MICROMAMBA_EXECUTABLE run -n album pip install git+https://gitlab.com/album-app/album.git@dev || echo "ALBUM_DEV_DISTRIBUTED not active"'
    - $MICROMAMBA_EXECUTABLE run -n album pip install --no-cache-dir -e $CI_PROJECT_DIR # -e needed for coverage
    - $MICROMAMBA_EXECUTABLE run -n album pip install coverage
    - $MICROMAMBA_EXECUTABLE run -n album python -V
    - $MICROMAMBA_EXECUTABLE run -n album pip list
    - $MICROMAMBA_EXECUTABLE run -n album env -0 | sort -z | tr '\0' '\n' | grep -i album
    - export ENVIRONMENT_DEBUGGING_MICROMAMBA_PATH=$MICROMAMBA_EXECUTABLE # set environment variables necessary to work with the environment API
    - export ENVIRONMENT_CONDA_LOCK_PATH=$(which conda-lock)
  cache:
    key: one-key-to-rule-them-all-linux
    paths:
      - .cache/pip

# Macos base template for running tests with micromamba as package manager
#
# Installs micromamba in a fresh tmp directory and activates it.
# DO NOT ALLOW JOBS TO BE RUN IN PARALLEL!
#
.macos_base_template_micromamba:
  tags:
    - macos
    - shell
  variables:
    MICROMAMBA_EXECUTABLE: "" # ensure that the variable is empty before running the job
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  before_script:
    - echo "$(uname)"
    - sw_vers
    - tmpdir=$(mktemp -d /tmp/album-test.XXXXXX)
    - echo $tmpdir
    - echo $tmpdir > /tmp/tmpdir
    - mkdir -p $tmpdir/bin/
    - curl -fsSL --retry 5 --retry-delay 3 https://micro.mamba.pm/api/micromamba/osx-64/$MICROMAMBA_CI_VERSION -o $tmpdir/micromamba.tar.bz2
    - tar -xvjf $tmpdir/micromamba.tar.bz2 -C $tmpdir/bin/ --strip-components=1 bin/micromamba
    - MICROMAMBA_EXECUTABLE=$tmpdir/bin/micromamba
    - $MICROMAMBA_EXECUTABLE --version
    - $MICROMAMBA_EXECUTABLE create -y -n album -c conda-forge python=$TEST_PYTHON_VERSION
    - echo $CI_COMMIT_REF_NAME
    - echo $ALBUM_DEV_DISTRIBUTED
    - bash -c '[[ $ALBUM_DEV_DISTRIBUTED == "True" ]] && echo "CAUTION! DEV ONLY OPTION ACTIVE. ENABLE/DISABLE BY SETTING ALBUM_DEV_DISTRIBUTED GITLAB-RUNNER VARIABLE." || echo "ALBUM_DEV_DISTRIBUTED not active"'
    - bash -c '[[ $ALBUM_DEV_DISTRIBUTED == "True" ]] && $MICROMAMBA_EXECUTABLE run -n album pip install git+https://gitlab.com/album-app/album-solution-api.git@dev || echo "ALBUM_DEV_DISTRIBUTED not active"'
    - bash -c '[[ $ALBUM_DEV_DISTRIBUTED == "True" ]] && $MICROMAMBA_EXECUTABLE run -n album pip install git+https://gitlab.com/album-app/album-environments.git@dev || echo "ALBUM_DEV_DISTRIBUTED not active"'
    - bash -c '[[ $ALBUM_DEV_DISTRIBUTED == "True" ]] && $MICROMAMBA_EXECUTABLE run -n album pip install git+https://gitlab.com/album-app/album.git@dev || echo "ALBUM_DEV_DISTRIBUTED not active"'
    - $MICROMAMBA_EXECUTABLE run -n album pip install --no-cache-dir -e $CI_PROJECT_DIR # -e needed for coverage
    - $MICROMAMBA_EXECUTABLE run -n album pip install coverage
    - $MICROMAMBA_EXECUTABLE run -n album python -V
    - $MICROMAMBA_EXECUTABLE run -n album pip list
    - $MICROMAMBA_EXECUTABLE run -n album env -0 | sort -z | tr '\0' '\n' | grep -i album
    - export ENVIRONMENT_DEBUGGING_MICROMAMBA_PATH=$MICROMAMBA_EXECUTABLE # set environment variables necessary to work with the environment API
    - export ENVIRONMENT_CONDA_LOCK_PATH=$(which conda-lock)
  after_script:
    - tmpdir=$(</tmp/tmpdir)
    - echo $tmpdir
    - rm -rf $tmpdir

#----------------------------
# stages
#----------------------------

stages:
  - test
  - release
  - deploy

#----------------------------
# jobs
#----------------------------

prepare release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - DeployRunner
    - DeployDocker
  script:
    - echo "preparing release"
    - VERSION=$(cat setup.cfg | grep "version=*" | awk '{split($0, s, " "); print s[3]}')
    - TAG=v$VERSION
    - echo "prepare to release version $VERSION with tag $TAG"
    - echo "VERSION=$VERSION" >> variables.env
    - echo "TAG=v$VERSION" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env
  rules:
    - if: $ALBUM_DEV_DISTRIBUTED == "True"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg

gitlab release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - DeployRunner
    - DeployDocker
  needs:
    - job: prepare release
      artifacts: true
  script:
    - echo "running release_job for version $VERSION and tag $TAG"
  rules:
    - if: $ALBUM_DEV_DISTRIBUTED == "True"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg
  release:
    name: "Release $TAG"
    description: "Created using the release-cli"
    tag_name: "$TAG"
    ref: "$CI_COMMIT_SHA"

gitlab pypi deploy:
  image: python:latest
  stage: deploy
  tags:
    - DeployRunner
    - DeployDocker
  needs:
    - job: gitlab release
    - job: prepare release
      artifacts: true
  script:
    - echo "deploying gitlab pypi version $VERSION"
    - pip install twine setuptools
    - python setup.py sdist bdist_wheel
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  rules:
    - if: $ALBUM_DEV_DISTRIBUTED == "True"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg

pypi deploy:
  image: python:latest
  stage: deploy
  tags:
    - DeployRunner
    - DeployDocker
  needs:
    - job: gitlab release
    - job: prepare release
      artifacts: true
  before_script:
    - echo "deploying pypi version $VERSION"
    - echo "using pypi deploy user $PYPI_DEPLOY_USER"
  script:
    - pip install twine setuptools
    - python setup.py sdist bdist_wheel
    - TWINE_PASSWORD=$PYPI_DEPLOY_TOKEN TWINE_USERNAME=$PYPI_DEPLOY_USER python -m twine upload --repository-url https://upload.pypi.org/legacy/  dist/*
  rules:
    - if: $ALBUM_DEV_DISTRIBUTED == "True"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg

unit tests linux micromamba:
  extends: .linux_base_template_micromamba
  stage: test
  script:
    #- coverage run --omit './test/*' -m unittest test/unit/run_all_unit_micromamba.py
    - $MICROMAMBA_EXECUTABLE run -n album coverage run --omit './test_distributed/*' -m unittest test_distributed/unit/run_all_unit.py
    - $MICROMAMBA_EXECUTABLE run -n album coverage report
    - mv .coverage unit.coverage # rename coverage file
  artifacts:
    paths:
      - unit.coverage

integration tests linux micromamba:
  extends: .linux_base_template_micromamba
  stage: test
  script:
    #- coverage run --omit './test/*' -m unittest test/integration/run_all_integration_micromamba.py
    - $MICROMAMBA_EXECUTABLE run -n album coverage run --omit './test_distributed/*' -m unittest test_distributed/integration/run_all_integration.py
    - $MICROMAMBA_EXECUTABLE run -n album coverage report
    - mv .coverage integration.coverage # rename coverage file
  artifacts:
    paths:
      - integration.coverage

# MacOs Tests

unit tests macos micromamba:
  extends: .macos_base_template_micromamba
  stage: test
  script:
    - $MICROMAMBA_EXECUTABLE run -n album python -m unittest test_distributed/unit/run_all_unit.py

integration tests macos micromamba:
  extends: .macos_base_template_micromamba
  stage: test
  script:
    - $MICROMAMBA_EXECUTABLE run -n album python -m unittest test_distributed/integration/run_all_integration.py

# Windows Tests with coverage

unit tests windows micromamba:
  extends: .windows_base_template_micromamba
  stage: test
  script:
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album coverage run --omit .\test_distributed\* -m unittest test_distributed\unit\run_all_unit.py'
    - 'if ($lastexitcode -ne 0) {exit(1)} else { .\micromamba_installation\Library\bin\micromamba.exe run -n album coverage report }'
    - 'if ($lastexitcode -ne 0) {exit(1)} else { .\micromamba_installation\Library\bin\micromamba.exe run -n album coverage xml } '
    - 'if ($lastexitcode -ne 0) {exit(1)} else { Rename-Item -Path ".coverage" -NewName "unit.coverage" }'
    - 'if ($lastexitcode -ne 0) {exit(1)} else { Rename-Item -Path "coverage.xml" -NewName "unit_coverage.xml" }'
    - "exit($lastexitcode)"
  artifacts:
    paths:
      - unit.coverage

integration tests windows micromamba:
  extends: .windows_base_template_micromamba
  stage: test
  script:
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album coverage run --omit .\test\* -m unittest test_distributed\integration\run_all_integration.py '
    - 'if ($lastexitcode -ne 0) {exit(1)} else { .\micromamba_installation\Library\bin\micromamba.exe run -n album coverage report }'
    - 'if ($lastexitcode -ne 0) {exit(1)} else { .\micromamba_installation\Library\bin\micromamba.exe run -n album coverage xml } '
    - 'if ($lastexitcode -ne 0) {exit(1)} else { Rename-Item -Path ".coverage" -NewName "integration.coverage" }'
    - 'if ($lastexitcode -ne 0) {exit(1)} else { Rename-Item -Path "coverage.xml" -NewName "integration_coverage.xml" }'
    - "exit($lastexitcode)"
  artifacts:
    paths:
      - integration.coverage

# Create combined coverage reports

create combined coverage for linux:
  extends: .linux_base_template_micromamba
  stage: test
  dependencies:
    - unit tests linux micromamba
    - integration tests linux micromamba
  needs:
    - unit tests linux micromamba
    - integration tests linux micromamba
  script:
    - $MICROMAMBA_EXECUTABLE run -n album coverage combine unit.coverage integration.coverage
    - $MICROMAMBA_EXECUTABLE run -n album coverage report
    - $MICROMAMBA_EXECUTABLE run -n album coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

create combined coverage for windows:
  extends: .windows_base_template_micromamba
  stage: test
  dependencies:
    - unit tests windows micromamba
    - integration tests windows micromamba
  needs:
    - unit tests windows micromamba
    - integration tests windows micromamba
  script:
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album coverage combine unit.coverage integration.coverage'
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album coverage report'
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album coverage xml'
    - "exit($lastexitcode)"
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
